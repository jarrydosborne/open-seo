name: Deploy OpenSEO (Osborne self-host)

# Deploys this fork to Osborne's own Cloudflare account using the documented
# deploy:selfhost path. Run it by hand from the Actions tab (also to pull in
# updates after syncing the fork with upstream).
#
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATAFORSEO_API_KEY
# Optional (Search Console): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET

on:
  workflow_dispatch:

concurrency:
  group: deploy-osborne
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'jarrydosborne/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Check secrets
        env:
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATAFORSEO_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repo secret $name"; exit 1; fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.selfhost
        env:
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          {
            echo "DATAFORSEO_API_KEY=$DATAFORSEO_API_KEY"
            echo "AUTH_MODE=password"
            # Optional: Google Search Console sign-in (docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md)
            if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
              echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
              echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            fi
          } > .env.selfhost

      - name: Bootstrap alchemy state store (adopts it if it already exists)
        run: pnpm alchemy cloudflare bootstrap

      - name: Deploy
        run: pnpm deploy:selfhost --yes
